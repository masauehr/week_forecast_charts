name: maps-model

# 1モデル分の「作図 → 公開」。update-maps.yml から、モデルごとに別々に呼ばれる（再利用ワークフロー）。
#  - build:   取得→アンサンブル平均→作図（GRIB2は1ステップごとに一時領域へ取得して削除）→成果物(artifact)
#  - publish: 公開ブランチ(gh-pages)の maps/ へ反映。同じブランチへ force push するので concurrency で順番待ちにする
# モデルごとに独立しているので、早く終わるモデル（GEFS 約5分）は、遅いモデル（ENS 約30分）を待たずに公開される。
on:
  workflow_call:
    inputs:
      model:
        description: "モデル（ens / gefs）"
        type: string
        required: true
      init:
        description: "初期値 YYYYMMDDHH（空なら最新の揃ったもの。空のときは揃っていない・公開済みなら何もしない）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      made: ${{ steps.made.outputs.made }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 日本語フォント
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 依存のインストール
        run: pip install -r requirements.txt
      - name: Natural Earth（海岸線・国境）のキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-ne-v2
      - name: テスト
        run: python -m pytest tests -q
      - name: 取得と作図（${{ inputs.model }}）
        env:
          INIT: ${{ inputs.init }}
          MODEL: ${{ inputs.model }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$INIT" ]; then
            python mean_pipeline.py --model "$MODEL" --init "$INIT" --out output/maps
          else
            python mean_pipeline.py --model "$MODEL" --out output/maps --skip-if-published
          fi
      - name: 成果物の確認
        id: made
        env:
          MODEL: ${{ inputs.model }}
        run: |
          if ls -d output/maps/"$MODEL"/??????????/ >/dev/null 2>&1; then
            echo "made=true" >> "$GITHUB_OUTPUT"
          else
            echo "made=false" >> "$GITHUB_OUTPUT"
            echo "作成した図がない（揃っていない／公開済み）"
          fi
      - name: 成果物の保存
        if: steps.made.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maps-${{ inputs.model }}
          path: output/maps/${{ inputs.model }}
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ needs.build.outputs.made == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 依存のインストール（manifest 作成が作図モジュールを読むため）
        run: pip install -r requirements.txt
      - name: 成果物の取り込み
        uses: actions/download-artifact@v4
        with:
          name: maps-${{ inputs.model }}
          path: output/maps/${{ inputs.model }}
      - name: 公開ブランチへ反映
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
        run: |
          d=$(ls -d output/maps/"$MODEL"/??????????/ | sort | tail -1)
          python publish.py --maps-src "${d%/}"
