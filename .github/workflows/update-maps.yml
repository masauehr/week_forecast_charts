name: update-maps

# アンサンブル平均の天気図（標準版・画用紙版）を作り、公開ブランチ(gh-pages)の maps/ へ反映する。
#  - モデル（ens=ECMWF ENS平均 / gefs=NOAA GEFS平均）ごとに、作図→公開が**独立して**流れる（maps-model.yml）。
#    早く終わる GEFS（約5分）は、遅い ENS（約30分）を待たずに公開される。公開だけは concurrency で順番待ち。
#  - 初期値が空（cron-job.org の定期起動）のときは、揃っていない・公開済みなら何もせず終わる（冪等）
on:
  workflow_dispatch:
    inputs:
      model:
        description: "作図するモデル（all で両方）"
        type: choice
        default: all
        options: [all, ens, gefs]
      init:
        description: "初期値 YYYYMMDDHH（UTCの00か12。空なら最新の揃ったもの）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  gefs:
    if: ${{ inputs.model == 'all' || inputs.model == 'gefs' || inputs.model == '' }}
    uses: ./.github/workflows/maps-model.yml
    with:
      model: gefs
      init: ${{ inputs.init }}
    permissions:
      contents: write

  ens:
    if: ${{ inputs.model == 'all' || inputs.model == 'ens' || inputs.model == '' }}
    uses: ./.github/workflows/maps-model.yml
    with:
      model: ens
      init: ${{ inputs.init }}
    permissions:
      contents: write
